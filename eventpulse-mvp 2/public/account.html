<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — EventPulse</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><a class="brand" href="/"><span>Event</span>Pulse</a><nav><a href="/">Events</a><a id="myDash" class="hidden" href="/dashboard.html">Dashboard</a></nav></header>
<main class="auth-wrap"><section class="auth-card" id="guest"><div class="eyebrow">YOUR ACCOUNT</div><h1>Join EventPulse</h1><div class="tabs"><button class="tab active" data-tab="login">Login</button><button class="tab" data-tab="register">Create account</button></div>
<form id="loginForm" class="form-grid"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="btn">Login</button><p id="loginMsg" class="form-note"></p></form>
<form id="registerForm" class="form-grid hidden"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="phone" inputmode="numeric" placeholder="10-digit phone" required><input name="password" type="password" minlength="6" placeholder="Password (6+ characters)" required><label>Account type</label><select name="role" id="role"><option value="customer">Customer — book tickets</option><option value="organizer">Organizer — list and sell tickets</option></select><button class="btn">Create account</button><p id="registerMsg" class="form-note"></p></form></section>
<section class="auth-card hidden" id="member"><div class="eyebrow">SIGNED IN</div><h1 id="hello">Hello</h1><p class="muted" id="details"></p><div class="hero-actions"><a id="memberDash" class="btn" href="/tickets.html">Open dashboard</a><button id="logout" class="btn btn-ghost">Logout</button></div></section></main>
<script>
const qs=new URLSearchParams(location.search); const next=qs.get('next'); if(qs.get('role')==='organizer'){document.getElementById('role').value='organizer';}
async function me(){const r=await fetch('/api/auth/me'),d=await r.json();if(d.user){guest.classList.add('hidden');member.classList.remove('hidden');hello.textContent=`Hi, ${d.user.name}`;details.textContent=`${d.user.email} • ${d.user.role}`;memberDash.href=d.user.role==='organizer'?'/dashboard.html':'/tickets.html';myDash.classList.remove('hidden');myDash.href=memberDash.href;}return d.user}
function switchTab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));loginForm.classList.toggle('hidden',name!=='login');registerForm.classList.toggle('hidden',name!=='register')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));if(qs.get('role'))switchTab('register');
loginForm.onsubmit=async e=>{e.preventDefault();loginMsg.textContent='Logging in...';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(loginForm)))}),d=await r.json();if(!r.ok){loginMsg.textContent=d.error;return}location.href=next|| (d.user.role==='organizer'?'/dashboard.html':'/tickets.html')};
registerForm.onsubmit=async e=>{e.preventDefault();registerMsg.textContent='Creating account...';const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(registerForm)))}),d=await r.json();if(!r.ok){registerMsg.textContent=d.error;return}location.href=d.user.role==='organizer'?'/dashboard.html':'/tickets.html'};
logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.reload()}; me();
</script></body></html>
