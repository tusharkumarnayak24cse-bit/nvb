<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tickets — EventPulse</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><a class="brand" href="/"><span>Event</span>Pulse</a><nav><a href="/">Events</a><a id="orgDash" class="hidden" href="/dashboard.html">Organizer</a><a href="/account.html">Account</a></nav></header>
<main class="dash-wrap"><div class="eyebrow">CUSTOMER</div><h1>My Tickets</h1><p class="muted">Paid bookings show a scannable QR ticket. Demo payment does not charge real money.</p><p id="msg" class="form-note"></p><div id="tickets" class="ticket-grid"></div></main>
<dialog id="qrDialog"><div class="dialog-card qr-card"><button type="button" class="close" onclick="qrDialog.close()">×</button><div class="eyebrow">DIGITAL TICKET</div><h3 id="qrTitle">Ticket</h3><img id="qrImage" alt="Ticket QR code"><p id="qrCode" class="code"></p><a id="waShare" target="_blank" class="btn btn-ghost">Share on WhatsApp</a></div></dialog>
<script>
const money=n=>'₹'+Number(n).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let bookings=[];
async function load(){const me=await fetch('/api/auth/me').then(r=>r.json());if(!me.user){location.href='/account.html?next=/tickets.html';return}if(me.user.role==='organizer')orgDash.classList.remove('hidden');const r=await fetch('/api/my/bookings'),d=await r.json();if(!r.ok){msg.textContent=d.error;return}bookings=d;tickets.innerHTML=d.map(b=>`<article class="ticket-card"><div><span class="status ${b.status}">${b.status.replace('_',' ')}</span><h3>${esc(b.event.title||'Event')}</h3><p>${esc(b.event.date||'')} • ${esc(b.event.venue||'')}, ${esc(b.event.city||'')}</p><small>${b.quantity} ticket(s) • Total ${money(b.total)}</small></div><div class="ticket-actions">${b.status==='paid'?`<button class="btn" onclick="showQR('${b.id}')">Show QR ticket</button>`:`<button class="btn" onclick="pay('${b.id}')">Complete payment</button>`}</div></article>`).join('')||'<div class="empty-card">You have no bookings yet. <a href="/">Explore events</a>.</div>'}
async function showQR(id){const b=bookings.find(x=>x.id===id);qrTitle.textContent=b.event.title;qrImage.src='/api/tickets/'+id+'/qr?x='+Date.now();qrCode.textContent=id.toUpperCase();const text=`EventPulse ticket%0A${encodeURIComponent(b.event.title)}%0ABooking: ${encodeURIComponent(id.toUpperCase())}`;waShare.href='https://wa.me/?text='+text;qrDialog.showModal()}
async function pay(id){const r=await fetch('/api/payments/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId:id})}),d=await r.json();if(!r.ok){msg.textContent=d.error;return}if(d.mode==='demo'){if(!confirm(`DEMO PAYMENT\n\nAmount: ${money(d.amount)}\nNo real money will be charged.`))return;const c=await fetch('/api/payments/demo-complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId:id})}),cd=await c.json();msg.textContent=cd.message||cd.error;if(c.ok)load();return}alert('For real Razorpay checkout, book from the event page where the Razorpay checkout script is loaded.')};load();
</script></body></html>
