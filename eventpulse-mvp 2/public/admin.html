<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventPulse Admin</title><link rel="stylesheet" href="styles.css"><style>.admin-table{width:100%;border-collapse:collapse;background:#13131b;border-radius:16px;overflow:hidden}.admin-table th,.admin-table td{padding:13px;text-align:left;border-bottom:1px solid #292934;font-size:.86rem}.admin-table th{color:#9696a4}.admin-section{margin-top:45px;overflow-x:auto}.keybar{display:flex;gap:10px;max-width:600px}.keybar input{flex:1}</style></head><body>
<header class="nav"><a class="brand" href="/"><span>Event</span>Pulse</a><a class="btn btn-ghost" href="/">Back to site</a></header><main class="dash-wrap"><div class="eyebrow">OWNER DASHBOARD</div><h1>Admin</h1><p class="muted">Use the ADMIN_KEY from your hosting environment.</p><div class="keybar"><input id="key" type="password" placeholder="Admin key"><button class="btn" id="loadBtn">Load</button></div><p id="msg" class="form-note"></p><div id="dash" class="hidden"><div class="stats"><div class="stat"><span>Users</span><strong id="users">0</strong></div><div class="stat"><span>Organizers</span><strong id="organizers">0</strong></div><div class="stat"><span>Pending events</span><strong id="pending">0</strong></div><div class="stat"><span>Paid fee revenue</span><strong id="revenue">₹0</strong></div></div><section class="admin-section"><h2>Events</h2><table class="admin-table"><thead><tr><th>Event</th><th>Organizer</th><th>Status</th><th>Featured</th><th>Actions</th></tr></thead><tbody id="eventsRows"></tbody></table></section><section class="admin-section"><h2>Recent bookings</h2><table class="admin-table"><thead><tr><th>Name</th><th>Status</th><th>Qty</th><th>Total</th><th>Booking ID</th></tr></thead><tbody id="bookingRows"></tbody></table></section><section class="admin-section"><h2>Promotion leads</h2><table class="admin-table"><thead><tr><th>Name</th><th>Phone</th><th>Event</th><th>Plan</th></tr></thead><tbody id="leadRows"></tbody></table></section></div></main>
<script>const money=n=>'₹'+Number(n).toLocaleString('en-IN');let adminKey='';async function api(url,opts={}){opts.headers={...(opts.headers||{}),'x-admin-key':adminKey};return fetch(url,opts)}async function load(){adminKey=key.value;msg.textContent='Loading...';const r=await api('/api/admin/overview'),d=await r.json();if(!r.ok){msg.textContent=d.error;return}msg.textContent='';dash.classList.remove('hidden');users.textContent=d.users;organizers.textContent=d.organizers;pending.textContent=d.pending;revenue.textContent=money(d.platformRevenue);eventsRows.innerHTML=d.events.map(e=>`<tr><td>${e.title}</td><td>${e.organizer||'-'}</td><td>${e.status}</td><td>${e.featured?'Yes':'No'}</td><td>${e.status==='pending'?`<button onclick="approve('${e.id}')">Approve</button>`:''} <button onclick="feature('${e.id}')">Featured</button></td></tr>`).join('');bookingRows.innerHTML=d.recentBookings.map(b=>`<tr><td>${b.name}</td><td>${b.status}</td><td>${b.quantity}</td><td>${money(b.total)}</td><td>${b.id}</td></tr>`).join('')||'<tr><td colspan="5">No bookings.</td></tr>';leadRows.innerHTML=d.leads.map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td><td>${x.eventName}</td><td>${x.plan}</td></tr>`).join('')||'<tr><td colspan="4">No leads.</td></tr>'}async function approve(id){await api('/api/admin/events/'+id+'/approve',{method:'POST'});load()}async function feature(id){await api('/api/admin/events/'+id+'/featured',{method:'POST'});load()}loadBtn.onclick=load;</script></body></html>
