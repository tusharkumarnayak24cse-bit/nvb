<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer Dashboard — EventPulse</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><a class="brand" href="/"><span>Event</span>Pulse</a><nav><a href="/">Marketplace</a><a href="/scanner.html">Scan Tickets</a><a href="/tickets.html">My Tickets</a><a href="/account.html">Account</a></nav></header>
<main class="dash-wrap"><div class="section-head"><div><div class="eyebrow">ORGANIZER</div><h1>Dashboard</h1><p class="muted">Create events and track paid ticket sales.</p></div><button class="btn" id="newBtn">+ New event</button></div><p id="topMsg" class="form-note"></p>
<div class="stats"><div class="stat"><span>Events</span><strong id="sEvents">0</strong></div><div class="stat"><span>Approved</span><strong id="sApproved">0</strong></div><div class="stat"><span>Paid tickets</span><strong id="sTickets">0</strong></div><div class="stat"><span>Gross ticket sales</span><strong id="sGross">₹0</strong></div></div>
<section class="dash-section"><h2>Your events</h2><div id="eventRows" class="dash-list"></div></section><section class="dash-section"><h2>Recent bookings</h2><div id="bookingRows" class="dash-list"></div></section></main>
<dialog id="eventDialog"><form id="eventForm" class="dialog-card wide"><button type="button" class="close" onclick="eventDialog.close()">×</button><div class="eyebrow">ORGANIZER EVENT</div><h3 id="eventFormTitle">Create event</h3><input type="hidden" name="id"><input name="title" placeholder="Event name *" required><div class="two"><input name="city" value="Ahmedabad" placeholder="City *" required><input name="venue" placeholder="Venue *" required></div><div class="two"><input name="date" type="date" required><input name="time" type="time"></div><div class="two"><input name="price" type="number" min="0" placeholder="Ticket price ₹"><input name="capacity" type="number" min="1" value="100" placeholder="Capacity"></div><div class="two"><select name="category"><option>Music</option><option>Party</option><option>Comedy</option><option>Networking</option><option>Workshop</option><option>Sports</option><option>Other</option></select><input name="contact" placeholder="Organizer contact"></div><input name="image" placeholder="Event image URL"><textarea name="description" rows="4" placeholder="Description"></textarea><button class="btn" type="submit">Save event</button><p id="eventMsg" class="form-note"></p></form></dialog>
<script>
let data={events:[],bookings:[]};const money=n=>'₹'+Number(n).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const me=await fetch('/api/auth/me').then(r=>r.json());if(!me.user){location.href='/account.html?role=organizer';return}if(me.user.role!=='organizer'){topMsg.textContent='This page requires an organizer account.';newBtn.disabled=true;return}const r=await fetch('/api/organizer/overview'),d=await r.json();if(!r.ok){topMsg.textContent=d.error;return}data=d;sEvents.textContent=d.stats.events;sApproved.textContent=d.stats.approved;sTickets.textContent=d.stats.tickets;sGross.textContent=money(d.stats.gross);eventRows.innerHTML=d.events.map(e=>`<div class="dash-row"><div><strong>${esc(e.title)}</strong><span>${esc(e.date)} • ${esc(e.venue)}, ${esc(e.city)}</span></div><div class="row-actions"><span class="status ${e.status}">${e.status}</span><button onclick="editEvent('${e.id}')">Edit</button><button onclick="removeEvent('${e.id}')">Delete</button></div></div>`).join('')||'<div class="empty-card">No events yet. Create your first event.</div>';bookingRows.innerHTML=d.bookings.map(b=>{const ev=d.events.find(e=>e.id===b.eventId);return `<div class="dash-row"><div><strong>${esc(ev?.title||'Event')}</strong><span>${esc(b.name)} • ${b.quantity} ticket(s) • ${b.status}</span></div><strong>${money(b.subtotal)}</strong></div>`}).join('')||'<div class="empty-card">No bookings yet.</div>'}
newBtn.onclick=()=>{eventForm.reset();eventForm.id.value='';eventForm.city.value='Ahmedabad';eventForm.capacity.value=100;eventFormTitle.textContent='Create event';eventMsg.textContent='';eventDialog.showModal()};
function editEvent(id){const e=data.events.find(x=>x.id===id);eventForm.reset();Object.keys(e).forEach(k=>{if(eventForm.elements[k])eventForm.elements[k].value=e[k]??''});eventForm.id.value=e.id;eventFormTitle.textContent='Edit event';eventMsg.textContent='Changes require admin re-approval.';eventDialog.showModal()}
async function removeEvent(id){if(!confirm('Delete this event?'))return;const r=await fetch('/api/organizer/events/'+id,{method:'DELETE'}),d=await r.json();topMsg.textContent=d.message||d.error;if(r.ok)load()}
eventForm.onsubmit=async ev=>{ev.preventDefault();eventMsg.textContent='Saving...';const body=Object.fromEntries(new FormData(eventForm)),id=body.id;delete body.id;const r=await fetch(id?'/api/organizer/events/'+id:'/api/organizer/events',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();eventMsg.textContent=d.message||d.error;if(r.ok){setTimeout(()=>eventDialog.close(),400);load()}};load();
</script></body></html>
