<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Scanner — EventPulse</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><a class="brand" href="/"><span>Event</span>Pulse</a><nav><a href="/dashboard.html">Organizer Dashboard</a><a href="/account.html">Account</a></nav></header>
<main class="auth-wrap"><section class="auth-card scanner-card"><div class="eyebrow">ORGANIZER CHECK-IN</div><h1>Scan tickets</h1><p class="muted">Use the camera where supported, or paste/type the booking ID printed below the QR ticket.</p><video id="video" class="scanner-video" playsinline muted></video><div class="hero-actions"><button class="btn" id="startCamera">Start camera</button><button class="btn btn-ghost hidden" id="stopCamera">Stop</button></div><div class="divider">OR MANUAL</div><form id="checkForm" class="form-grid"><input id="code" name="code" placeholder="BOOK_... booking ID" required><button class="btn">Check in ticket</button></form><div id="result" class="check-result hidden"></div></section></main>
<script>
let stream=null, scanning=false;const video=document.getElementById('video'),result=document.getElementById('result');
async function verify(raw){result.classList.remove('hidden');result.innerHTML='Checking ticket...';let code=String(raw||'').trim();try{if(code.startsWith('{'))code=JSON.parse(code).bookingId||code}catch{}const r=await fetch('/api/organizer/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId:code})}),d=await r.json();if(r.ok){result.className='check-result success';result.innerHTML=`<strong>✓ ${d.message}</strong><span>${d.event.title}</span><span>${d.booking.name} • ${d.booking.quantity} ticket(s)</span>`}else{result.className='check-result error';result.innerHTML=`<strong>${d.error}</strong>${d.checkedInAt?`<span>Previous check-in: ${new Date(d.checkedInAt).toLocaleString()}</span>`:''}`}}
checkForm.onsubmit=e=>{e.preventDefault();verify(code.value)};
startCamera.onclick=async()=>{if(!('BarcodeDetector'in window)){result.className='check-result error';result.innerHTML='<strong>Camera QR scanning is not supported by this browser.</strong><span>Use the booking ID field instead.</span>';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;await video.play();startCamera.classList.add('hidden');stopCamera.classList.remove('hidden');scanning=true;const detector=new BarcodeDetector({formats:['qr_code']});const loop=async()=>{if(!scanning)return;try{const codes=await detector.detect(video);if(codes.length){scanning=false;await verify(codes[0].rawValue);stop();return}}catch{}requestAnimationFrame(loop)};loop()}catch(e){result.className='check-result error';result.innerHTML='<strong>Could not access camera.</strong><span>Check browser permission or use manual booking ID.</span>'}};
function stop(){scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;startCamera.classList.remove('hidden');stopCamera.classList.add('hidden')}stopCamera.onclick=stop;window.addEventListener('beforeunload',stop);
fetch('/api/auth/me').then(r=>r.json()).then(d=>{if(!d.user||d.user.role!=='organizer')location.href='/account.html?role=organizer'});
</script></body></html>
